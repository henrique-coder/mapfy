[build-system]
requires = [
    "uv_build>=0.12.0, <0.13.0"
]
build-backend = "uv_build"

[project]
name = "mapfy"
version = "0.1.0"
description = "Search Google Maps places, normalize locations, and build Street View image links"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Henrique Moreira", email = "78804989+henrique-coder@users.noreply.github.com" }
]
keywords = ["google-maps", "street-view", "places", "maps", "scraper"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11, <3.16"
dependencies = [
    "curl-cffi>=0.16.0",
    "pydantic>=2.13.0, <3.0.0",
    "orjson>=3.12.0",
]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "rich>=15.0.0",
]
lint = [
    "ruff>=0.16.0",
    "ty>=0.0.70",
]
test = [
    "pytest>=9.1.0",
]

[project.urls]
Homepage = "https://github.com/henrique-coder/mapfy"
Repository = "https://github.com/henrique-coder/mapfy.git"
Issues = "https://github.com/henrique-coder/mapfy/issues"

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D203", "D213", "ISC001"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["mapfy"]
lines-after-imports = 2
split-on-trailing-comma = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PT009", "PT027", "S101"]

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"
skip-magic-trailing-comma = false
